spring:
  docker:
    compose:
      enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/social_post_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
  app:
    outbox:
      publish_delay_ms: 1000
  storage:
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY:socialpostadmin}
      secret-key: ${MINIO_SECRET_KEY:socialpostadmin123}

      bucket: ${MINIO_BUCKET:social-post-media}

      upload-url-expiry-seconds: 900
      download-url-expiry-seconds: 300

      max-image-size-bytes: 10485760
      max-video-size-bytes: 104857600
